kind = "web"
previewPath = "/"
title = "GTM Wedge Finder"
version = "1.0.0"
id = "artifacts/gtm-wedge-finder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20032

[services.development]
run = "pnpm --filter @workspace/gtm-wedge-finder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gtm-wedge-finder", "run", "build" ]
publicDir = "artifacts/gtm-wedge-finder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20032"
BASE_PATH = "/"
